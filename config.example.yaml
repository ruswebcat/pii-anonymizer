# Пример настроек прокси обезличивания персональных данных.
#
# Это НЕ рабочий файл, а образец: скопируйте его, впишите свои значения и передайте путь службе
# (переменная PII_PROXY_CONFIG или ключ --config у приборов). Все значения окружения из
# deploy/pii-proxy.env.example имеют приоритет над этим файлом, а файл — над умолчаниями кода.
#
# Ничего специфического для конкретной организации в коде нет: бренд, филиалы, тарифы, город,
# свои адреса, телефоны ресепции и названия своей системы учёта задаются здесь. Пустое значение —
# безопасное умолчание: нечего отбрасывать сверх общей служебной лексики.

# --- своя лексика организации --------------------------------------------------------------
# Зачем это нужно: часть карточек клиентов заведена с адресом клуба или его телефоном, и такие
# значения законно попадают в словарь известных значений. Без этого раздела прокси заменил бы
# адрес клуба или его телефон как данные клиента — то есть испортил бы обычный рабочий текст.
#
# own_terms — бренд и его части, названия филиалов и тарифов, город работы, служебные сокращения
# своей системы учёта. Слова проверяются как отдельные слова и как фразы целиком.
#
# ЗАПОЛНИТЬ СВОИМИ ЗНАЧЕНИЯМИ. В образце — выдуманные:
own_vocabulary:
  terms:
    - "Пример Спорт"          # название организации (и как пишется без пробела: «ПримерСпорт»)
    - "ПримерСпорт"
    - "Пример"                # заметная часть бренда, если она используется отдельно
    - "Спорт"
    - "Примерск"              # город, в котором работает организация
    - "Северный"              # филиал
    - "Центральный"           # филиал
    - "Базовый"                 # тариф
    - "Квартальный"              # тариф
    - "Годовой"                  # тариф
  # own_addresses — свои адреса (адреса клубов). Сравнение идёт по строке целиком, в нижнем
  # регистре, со сжатыми пробелами: «б-р садовая 3а» и «Б-р  Садовая 3А» — одно и то же.
  addresses:
    - "б-р Садовая 3а"
    - "пр. Заводская 19А"
    - "ул. Садовая 12"
  # own_phones — телефоны ресепции. Формат записи не важен: сравниваются цифры, 8-форма
  # приводится к 7-форме.
  phones:
    - "+7 (8481) 000-011"
    - "79001110011"
  # own_service_objects — названия своей системы учёта и служебных записей, которые она
  # оставляет в поле ФИО карточки («CRM», «Общая база клиентов» и подобные). Это не люди.
  service_objects:
    - "CRM"
    - "Admin CRM"
    - "Менеджер CRM"

# Через окружение то же самое задаётся строками:
#   PII_PROXY_OWN_TERMS="Пример Спорт,Примерск,Северный,Базовый"
#   PII_PROXY_OWN_ADDRESSES="б-р Садовая 3а,пр. Заводская 19А"
#   PII_PROXY_OWN_PHONES="+7 (8481) 000-011,79001110011"
#   PII_PROXY_OWN_SERVICE_OBJECTS="CRM,Admin CRM"
# либо одним файлом JSON: PII_PROXY_OWN_VOCAB=/etc/pii-proxy/own-vocabulary.json

# --- служебная лексика (тарифы, клубы, услуги) ----------------------------------------------
# Зачем отдельно от own_vocabulary: у этих двух списков разные работы. own_vocabulary —
# стоп-лист распознавания («эти слова наши, их никогда не заменять»). Этот раздел — список
# замера для измерителя шума справочника (tools/dict_noise_report.py): тарифы, названия клубов
# и услуг, которые система учёта оставляет в поле ФИО. Измеритель считает, сколько таких слов
# лежит в справочнике как «имена», и по решению оператора снимает их оттуда.
#
# В коде публичной сборки этих слов нет: у другой сети тарифы и клубы называются иначе.
# Умолчание — пусто: тогда измеритель работает только по общим категориям (должности, статусы,
# поля системы учёта, заглушки) и прямо скажет, что сверх них замерять нечего.
# Своя лексика организации из own_vocabulary замеряется наравне с этим разделом.
# ЗАПОЛНИТЬ СВОИМИ ЗНАЧЕНИЯМИ. В образце — выдуманные:
service_lexicon:
  "тарифы и клубы":
    - "Годовой"
    - "Базовый"
    - "Северный"
    - "Центральный"
  "услуги и группы":
    - "групповые занятия"
    - "персональная тренировка"
    - "пробное занятие"
# Через окружение — строкой (все слова в одну категорию) или файлом JSON с категориями:
#   PII_PROXY_SERVICE_LEXICON="Годовой,Базовый,групповые занятия"
#   PII_PROXY_SERVICE_LEXICON_FILE=/etc/pii-proxy/service-lexicon.json

# --- маршруты поставщиков моделей ----------------------------------------------------------
# Каждый маршрут — HTTPS и только HTTPS: небезопасный адрес останавливает запуск.
routes:
  ds: "https://api.deepseek.com"
  nord: "https://nordrouter.com"

# --- где слушать ---------------------------------------------------------------------------
# Только loopback: прокси обязан быть недоступен из сети, иначе он перестаёт быть границей.
host: "127.0.0.1"
port: 8791

# --- каналы восстановления -------------------------------------------------------------------
# Где восстанавливаются значения (текст ответа; аргументы инструментов восстанавливаются всегда).
# Умолчание публичной сборки — ЛЮБОЙ канал: пустое значение или явный признак «*». Так сделано
# потому, что обобщённый продукт не знает имён каналов своего оператора.
#
# ВНИМАНИЕ, ЭТО РЕШЕНИЕ О ЦЕНЕ РИСКА. Для оператора, которому приватность важнее удобства,
# список следует СУЗИТЬ до доверенных каналов: восстановление в непубличном канале может
# вернуть персональные данные туда, где их быть не должно. Пример сужения — строкой ниже.
#
# Канал вне контура (внешний мессенджер) не восстанавливается никогда и указать его здесь
# нельзя: служба откажется стартовать.
detok_channels: "*"
# detok_channels: ["mattermost", "local"]   # пример сужения до доверенных каналов

# --- политика ------------------------------------------------------------------------------
# allow — изображение проходит, в ответ добавляется напоминание об ответственности;
# block — строгий режим: запрос с изображением отклоняется.
image_policy: "allow"
# auto — идти тем путём, который запросил клиент; json_only — всегда непотоковый обмен.
stream_mode: "auto"
ttl_days: 90
cache_size: 512
# Кэш блоков: предел по объёму рядом с пределом по числу записей. Бюджет в мегабайтах
# ограничивает память, процесс по числу записей — нет: сто блоков бывают и десятью
# килобайтами, и десятью мегабайтами. Выключается целиком.
block_cache_limit_mb: 64
block_cache_enabled: true
# Порог редкости: сколько записей должно быть в ячейке признаков, чтобы вывод не считался
# выделяющим. advisory — считать и показывать, enforce — отказывать.
rarity_k: 5
rarity_enforce: false

# --- слои распознавания --------------------------------------------------------------------
# Пустой путь выключает слой: выключенная возможность должна быть видна, а не подразумеваться.
name_layer: ""       # открытый слой имён (собирается tools/build_name_layer.py)
name_combos: ""      # индекс со-встречаемости частей ФИО (tools/build_name_combos.py)
coherence_mode: "off"   # off | audit | enforce — проверка связности персоны
ner_enabled: false
ner_backend: "auto"     # auto | morphology | neural

# --- состояние -----------------------------------------------------------------------------
# Пути состояния задаются здесь либо переменными окружения. В примере — пользовательский режим;
# для системного юнита используйте /var/lib/pii-proxy и /var/log/pii-proxy.
map_db_path: "/var/lib/pii-proxy/pii_map.db"
dictionary_path: "/var/lib/pii-proxy/pii_dict.json"
audit_log_path: "/var/log/pii-proxy/audit.jsonl"
incident_log_path: "/var/log/pii-proxy/incidents"

# --- диагностика ---------------------------------------------------------------------------
log_level: "INFO"
